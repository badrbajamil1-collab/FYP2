AWSTemplateFormatVersion: "2010-09-09"
Description: >
  PolyFlow deployment stack — edge ingestion (IoT Core) -> real-time streaming
  (Kinesis) -> isolated inference (EKS) -> event routing (EventBridge) ->
  alerting (SNS) + durable storage (Aurora Serverless v2 via Data API).
  This is a starting point, not a hardened production template — review IAM
  scopes, subnet sizing, and instance types before using it for anything
  beyond a dev/staging environment.

# ---------------------------------------------------------------------------
# PARAMETERS
# ---------------------------------------------------------------------------
Parameters:
  EnvironmentName:
    Type: String
    Default: polyflow
    Description: Prefix used to name and tag all resources.

  VpcCIDR:
    Type: String
    Default: 10.20.0.0/16

  PublicSubnet1CIDR:
    Type: String
    Default: 10.20.0.0/20
  PublicSubnet2CIDR:
    Type: String
    Default: 10.20.16.0/20
  PrivateSubnet1CIDR:
    Type: String
    Default: 10.20.128.0/20
  PrivateSubnet2CIDR:
    Type: String
    Default: 10.20.144.0/20

  EksClusterVersion:
    Type: String
    Default: "1.30"
    Description: Pin this to a currently-supported EKS version at deploy time.

  NodeInstanceType:
    Type: String
    Default: t3.medium

  NodeGroupDesiredSize:
    Type: Number
    Default: 2
  NodeGroupMinSize:
    Type: Number
    Default: 1
  NodeGroupMaxSize:
    Type: Number
    Default: 4

  DBMasterUsername:
    Type: String
    Default: polyflowadmin

  DBName:
    Type: String
    Default: polyflow

  DBEngineVersion:
    Type: String
    Default: "15.4"
    Description: Aurora PostgreSQL engine version — check current supported versions before deploying.

  AlertEmail:
    Type: String
    Default: ""
    Description: Optional — email address to subscribe to the SNS alert topic. Leave blank to skip.

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

# ---------------------------------------------------------------------------
# RESOURCES
# ---------------------------------------------------------------------------
Resources:

  # ------------------------------- Networking -------------------------------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCIDR
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-vpc"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-igw"

  IGWAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet1CIDR
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-public-1"
        - Key: kubernetes.io/role/elb
          Value: "1"

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet2CIDR
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-public-2"
        - Key: kubernetes.io/role/elb
          Value: "1"

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet1CIDR
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-private-1"
        - Key: kubernetes.io/role/internal-elb
          Value: "1"

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet2CIDR
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-private-2"
        - Key: kubernetes.io/role/internal-elb
          Value: "1"

  NatEIP:
    Type: AWS::EC2::EIP
    DependsOn: IGWAttachment
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-nat"

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-public-rt"

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: IGWAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable
  PublicSubnet2RTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-private-rt"

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable
  PrivateSubnet2RTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # ------------------------------- Kinesis -------------------------------
  FeatureStream:
    Type: AWS::Kinesis::Stream
    Properties:
      Name: !Sub "${EnvironmentName}-feature-stream"
      StreamModeDetails:
        StreamMode: ON_DEMAND
      RetentionPeriodHours: 24

  RawVideoStream:
    Type: AWS::KinesisVideo::Stream
    Properties:
      Name: !Sub "${EnvironmentName}-raw-video"
      DataRetentionInHours: 24

  # ------------------------------- IoT Core -------------------------------
  IoTToKinesisRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-iot-to-kinesis"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: iot.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PutToFeatureStream
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: kinesis:PutRecord
                Resource: !GetAtt FeatureStream.Arn

  IoTFeatureRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: !Sub "${EnvironmentName}_edge_features_to_kinesis"
      TopicRulePayload:
        Sql: "SELECT * FROM 'polyflow/+/features'"
        AwsIotSqlVersion: "2016-03-23"
        RuleDisabled: false
        Actions:
          - Kinesis:
              StreamName: !Ref FeatureStream
              PartitionKey: "${topic()}"
              RoleArn: !GetAtt IoTToKinesisRole.Arn

  # -------------------------------- EKS -----------------------------------
  EksClusterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-eks-cluster-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy

  EksNodeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-eks-node-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly

  EksCluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Sub "${EnvironmentName}-cluster"
      Version: !Ref EksClusterVersion
      RoleArn: !GetAtt EksClusterRole.Arn
      ResourcesVpcConfig:
        SubnetIds:
          - !Ref PublicSubnet1
          - !Ref PublicSubnet2
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
        EndpointPublicAccess: true
        EndpointPrivateAccess: true

  EksNodeGroup:
    Type: AWS::EKS::Nodegroup
    Properties:
      ClusterName: !Ref EksCluster
      NodegroupName: !Sub "${EnvironmentName}-inference-nodes"
      NodeRole: !GetAtt EksNodeRole.Arn
      Subnets:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      InstanceTypes:
        - !Ref NodeInstanceType
      ScalingConfig:
        DesiredSize: !Ref NodeGroupDesiredSize
        MinSize: !Ref NodeGroupMinSize
        MaxSize: !Ref NodeGroupMaxSize
      AmiType: AL2_x86_64
    # NOTE: per-stream/per-tenant isolation (Namespaces, ResourceQuotas,
    # NetworkPolicies) is applied via kubectl/Helm after the cluster exists —
    # CloudFormation provisions the cluster and node capacity, not the
    # in-cluster Kubernetes objects.

  # ---------------------------- Aurora (storage) ----------------------------
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for PolyFlow Aurora cluster
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow Postgres traffic within the VPC
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !Ref VpcCIDR

  AuroraCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      DBClusterIdentifier: !Sub "${EnvironmentName}-aurora"
      Engine: aurora-postgresql
      EngineVersion: !Ref DBEngineVersion
      EngineMode: provisioned
      DatabaseName: !Ref DBName
      MasterUsername: !Ref DBMasterUsername
      ManageMasterUserPassword: true
      EnableHttpEndpoint: true   # turns on the Data API so Lambda can reach it without VPC networking
      DBSubnetGroupName: !Ref DBSubnetGroup
      VpcSecurityGroupIds:
        - !Ref DBSecurityGroup
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0.5
        MaxCapacity: 4

  AuroraInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub "${EnvironmentName}-aurora-instance-1"
      Engine: aurora-postgresql
      DBInstanceClass: db.serverless
      DBClusterIdentifier: !Ref AuroraCluster

  # ------------------------------ SNS (alerts) ------------------------------
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${EnvironmentName}-alerts"

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # ------------------------- EventBridge (routing) --------------------------
  PolyFlowEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "${EnvironmentName}-events"

  AnomalyRoutingRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${EnvironmentName}-anomaly-routing"
      EventBusName: !Ref PolyFlowEventBus
      EventPattern:
        source:
          - polyflow.inference
        detail-type:
          - AnomalyDetected
      Targets:
        - Id: AlertSns
          Arn: !Ref AlertTopic
        - Id: PersistToAurora
          Arn: !GetAtt PersistAlertFunction.Arn

  AlertTopicEventBridgePolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref AlertTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlertTopic
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt AnomalyRoutingRule.Arn

  PersistAlertInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PersistAlertFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt AnomalyRoutingRule.Arn

  # ------------------- Lambda bridge: EventBridge -> Aurora -------------------
  PersistAlertRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-persist-alert-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DataApiAndSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - rds-data:ExecuteStatement
                  - rds-data:BatchExecuteStatement
                Resource: !GetAtt AuroraCluster.DBClusterArn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !GetAtt AuroraCluster.MasterUserSecret.SecretArn

  PersistAlertFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${EnvironmentName}-persist-alert"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt PersistAlertRole.Arn
      Timeout: 15
      Environment:
        Variables:
          CLUSTER_ARN: !GetAtt AuroraCluster.DBClusterArn
          SECRET_ARN: !GetAtt AuroraCluster.MasterUserSecret.SecretArn
          DATABASE_NAME: !Ref DBName
      Code:
        ZipFile: |
          import boto3
          import os
          import json

          rds_data = boto3.client("rds-data")

          CLUSTER_ARN = os.environ["CLUSTER_ARN"]
          SECRET_ARN = os.environ["SECRET_ARN"]
          DATABASE_NAME = os.environ["DATABASE_NAME"]

          # Run once manually (or via a migration tool) before relying on this function:
          #   CREATE TABLE IF NOT EXISTS alerts (
          #     id SERIAL PRIMARY KEY,
          #     camera_id TEXT,
          #     anomaly_type TEXT,
          #     score DOUBLE PRECISION,
          #     detected_at TIMESTAMPTZ DEFAULT now(),
          #     raw_event JSONB
          #   );

          def handler(event, context):
              detail = event.get("detail", {})
              rds_data.execute_statement(
                  resourceArn=CLUSTER_ARN,
                  secretArn=SECRET_ARN,
                  database=DATABASE_NAME,
                  sql=(
                      "INSERT INTO alerts (camera_id, anomaly_type, score, raw_event) "
                      "VALUES (:camera_id, :anomaly_type, :score, CAST(:raw_event AS JSONB))"
                  ),
                  parameters=[
                      {"name": "camera_id", "value": {"stringValue": str(detail.get("camera_id", "unknown"))}},
                      {"name": "anomaly_type", "value": {"stringValue": str(detail.get("anomaly_type", "unknown"))}},
                      {"name": "score", "value": {"doubleValue": float(detail.get("score", 0.0))}},
                      {"name": "raw_event", "value": {"stringValue": json.dumps(event)}},
                  ],
              )
              return {"status": "stored"}

# ---------------------------------------------------------------------------
# OUTPUTS
# ---------------------------------------------------------------------------
Outputs:
  EksClusterName:
    Value: !Ref EksCluster
  EksUpdateKubeconfigCommand:
    Value: !Sub "aws eks update-kubeconfig --name ${EksCluster} --region ${AWS::Region}"
  FeatureStreamName:
    Value: !Ref FeatureStream
  RawVideoStreamName:
    Value: !Ref RawVideoStream
  EventBusName:
    Value: !Ref PolyFlowEventBus
  AlertTopicArn:
    Value: !Ref AlertTopic
  AuroraClusterEndpoint:
    Value: !GetAtt AuroraCluster.Endpoint.Address
  AuroraSecretArn:
    Value: !GetAtt AuroraCluster.MasterUserSecret.SecretArn
    Description: Secrets Manager ARN holding the generated Aurora master password.
